# Generated release train for Acativa.
# Edit the release declaration and regenerate instead of changing this file
# by hand.
#
# Two ways to release, one pipeline:
#
# - Weekly train: every Fri through 23:59 UTC+08:00 (Asia/Shanghai). The candidate
#   is the last commit merged into `nightly` (the default branch until the
#   repository adopts `nightly`) before the cutoff. The bump is the highest
#   `release:patch`, `release:minor` or `release:major` label among its pull
#   requests, patch when none is set. The train runs as a rehearsal.
# - Run workflow: releases the head of `nightly` (or the requested commit)
#   now, at the version typed in or bumped by the chosen level.
#
# There is deliberately no tag trigger: `publish.yml` accepts release
# inputs only from verify runs on the default branch, and a pushed tag is
# only as trustworthy as whoever pushed it. The release job creates the
# tag itself after verification.
#
# A candidate identical to the last published release is skipped. A failed
# step stops the run until a person reruns it; a rerun finishes a partly
# uploaded version instead of skipping past it.
#
# Two jobs split at the code-execution boundary:
#
# - `decide` never executes candidate code. It checks out the default
#   branch, resolves the candidate/version decision with the trusted
#   helper, strips the candidate's `.cargo` configuration before touching
#   its manifests, and writes the release-inputs artifact. Its outputs are
#   the only release decision the publish gate sees.
# - `verify` is untrusted: it checks out the candidate and runs its
#   fmt/clippy/tests plus the dry-run package. It produces no release
#   artifact; its conclusion is bound to the gate through the run's
#   `conclusion`, not through any data it could forge.
#
# `publish.yml` (the release side) is the only file that holds the OIDC
# publishing job; it runs the default branch's own copy after this verify
# train completes, so a candidate ref can never supply the workflow that
# receives the publishing identity.
#
# Credentials: this file needs none; a read-only token suffices.
name: verify

on:
  schedule:
    - cron: "0 16 * * 5"
  workflow_dispatch:
    inputs:
      version:
        description: Exact version to publish, such as 0.3.0; empty bumps by level
        required: false
        default: ""
      level:
        description: Bump level when no version is given
        type: choice
        options: [patch, minor, major]
        default: patch
      candidate:
        description: Commit or branch to release; empty takes the head of nightly
        required: false
        default: ""
      rehearse:
        description: Rehearse only; nothing is pushed, tagged or uploaded
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-train
  cancel-in-progress: false

env:
  # One declaration for the train's cadence and dependency patience; the
  # helper steps below take their values from here and nowhere else.
  TRAIN_WEEKDAY: fri
  TRAIN_TIME: "23:59"
  TRAIN_UTC_OFFSET: "+08:00"
  TRAIN_WAIT_MINUTES: "150"

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.version.outputs.release }}
      next: ${{ steps.version.outputs.next }}
      needs_set: ${{ steps.version.outputs.needs_set }}
      excludes: ${{ steps.version.outputs.excludes }}
      sha: ${{ steps.candidate.outputs.sha }}
      branch: ${{ steps.candidate.outputs.branch }}
      ready: ${{ steps.deps.outputs.ready }}
    env:
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_LEVEL: ${{ inputs.level }}
      SIBLINGS: '[]'
      # Kind and mode expand from immutable run metadata — never from a
      # file or variable candidate code could have produced.
      RELEASE_KIND: ${{ github.event_name == 'schedule' && 'train' || 'manual' }}
      RELEASE_MODE: ${{ github.event_name == 'schedule' && 'dry-run' || inputs.rehearse && 'dry-run' || 'live' }}
    defaults:
      run:
        shell: bash
        working-directory: Acativa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: Acativa
          fetch-depth: 0
          # No credential is persisted into the clone: the helper's network
          # calls go through GH_TOKEN explicitly, and nothing else needs a
          # token left in `.git/config` where a checkout could read it.
          persist-credentials: false

      # Copied before the candidate checkout replaces the working tree, so the
      # helper always matches this workflow.
      - name: Stage the train helper
        run: cp .github/release-train.py "$RUNNER_TEMP/train.py"

      - name: Select the candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ inputs.candidate }}
        run: |
          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          python3 "$RUNNER_TEMP/train.py" candidate --weekday="$TRAIN_WEEKDAY" \
            --time="$TRAIN_TIME" --utc-offset="$TRAIN_UTC_OFFSET" \
            --default-branch="$default_branch" --override="$OVERRIDE"

      # The candidate step detached the checkout to the candidate commit:
      # from here the working tree is candidate *data*. Strip its cargo
      # configuration before cargo ever resolves anything against it — a
      # checked-in `.cargo/config.toml` could name a credential provider,
      # which is an executable, not data.
      - name: Neutralize candidate cargo configuration
        run: rm -rf .cargo

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Wait for cross-repository dependencies
        id: deps
        run: python3 "$RUNNER_TEMP/train.py" deps --wait-minutes="$TRAIN_WAIT_MINUTES"

      - name: Compute the release version
        id: version
        if: steps.deps.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.candidate.outputs.sha }}
          BRANCH: ${{ steps.candidate.outputs.branch }}
        run: python3 "$RUNNER_TEMP/train.py" version --candidate="$CANDIDATE" --branch="$BRANCH"

      # The release train (default branch) reads this data-only file to
      # learn the candidate, the version decision and the kind of run; it
      # lands for every trigger so the gate job can short-circuit cleanly
      # on rehearsals and unqualified candidates. This job is the only one
      # that writes it, and no candidate code has executed here — the file
      # is trusted data all the way down.
      - name: Record the release inputs
        if: always()
        run: |
          mkdir -p target/release-inputs
          cat > target/release-inputs/env <<EOF
          sha=${{ steps.candidate.outputs.sha }}
          branch=${{ steps.candidate.outputs.branch }}
          release=${{ steps.version.outputs.release == 'true' }}
          kind=${{ github.event_name == 'schedule' && 'train' || 'manual' }}
          mode=${{ github.event_name == 'schedule' && 'dry-run' || inputs.rehearse && 'dry-run' || 'live' }}
          next=${{ steps.version.outputs.next || '0.0.0' }}
          needs_set=${{ steps.version.outputs.needs_set == 'true' }}
          excludes=${{ steps.version.outputs.excludes }}
          EOF

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-inputs
          path: Acativa/target/release-inputs/
          retention-days: 7
          if-no-files-found: error

  verify:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        shell: bash
        working-directory: Acativa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: Acativa
          ref: ${{ needs.decide.outputs.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Install the pinned toolchain
        run: |
          if [ -f rust-toolchain.toml ] || [ -f rust-toolchain ]; then
            rustup toolchain install
          fi

      - name: Verify
        run: |
          cargo fmt --all --check && cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace --all-targets
      # The bump is applied here only so the dry-run validates the exact
      # release versions; the OIDC job recreates it from the bound commit —
      # nothing a verify-runner produced crosses the OIDC boundary.
      - name: Apply the release version
        if: needs.decide.outputs.needs_set == 'true'
        env:
          NEXT: ${{ needs.decide.outputs.next }}
        run: |
          cargo install cargo-edit@0.13.13 --locked --no-default-features --features set-version
          cargo set-version --workspace "$NEXT"
          cargo update --workspace

      # Dry-run validation only. No artifacts ship to the OIDC job: it
      # repackages the bound commit itself with `cargo package --no-verify`,
      # which collects manifest-declared files without compiling or running
      # build scripts.
      - name: Package
        env:
          EXCLUDES: ${{ needs.decide.outputs.excludes }}
        run: |
          args=()
          for crate in $EXCLUDES; do args+=(--exclude "$crate"); done
          cargo publish --workspace --dry-run --allow-dirty "${args[@]}"
